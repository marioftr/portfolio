<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png?v=4" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16.png?v=4" />
    <link rel="icon" href="/favicon.ico?v=4" sizes="48x48" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png?v=4" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#fbfaf7" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,300..900&family=Inter:wght@300;400;500;600;700;800;900&display=swap" />
    <title>Mario Villanueva Torres — Portfolio</title>
    <script>
      (function () {
        var saved = null;
        try { saved = localStorage.getItem('portfolio_theme_choice'); } catch (e) {}
        var dark = saved ? saved === 'dark' : window.matchMedia('(prefers-color-scheme: dark)').matches;
        if (dark) document.documentElement.classList.add('dark');
        // Safari móvil tiñe la barra de estado con este color: se ajusta antes del primer pintado.
        document.querySelector('meta[name="theme-color"]').setAttribute('content', dark ? '#121211' : '#fbfaf7');
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
